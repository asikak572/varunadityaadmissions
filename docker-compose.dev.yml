services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: varunaditya_db
      POSTGRES_USER: varun
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://varun:devpassword@postgres:5432/varunaditya_db
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev -- --host
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_dev_data:
